name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Run unit tests
        timeout-minutes: 25
        run: |
          ATTEMPT=0
          until gradle :app:testDebugUnitTest --stacktrace; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge 3 ]; then exit 1; fi
            sleep 90
          done
      - name: Lint
        run: gradle :app:lintDebug --stacktrace || echo "lint reported issues"
      - name: Assemble debug APK
        timeout-minutes: 25
        run: |
          ATTEMPT=0
          until gradle :app:assembleDebug --stacktrace; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge 3 ]; then exit 1; fi
            sleep 90
          done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoledz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
