name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Run unit tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
      - name: Surface test errors
        if: failure()
        run: |
          grep -a -E "FAILED|error:|e: .*\.kt|What went wrong|Caused by" build-test.log | head -20 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - name: Lint
        run: gradle :app:lintDebug --stacktrace || echo "lint reported issues"
      - name: Assemble debug APK
        timeout-minutes: 25
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build-assemble.log
      - name: Surface assemble errors
        if: failure()
        run: |
          grep -a -E "FAILED|error:|e: .*\.kt|What went wrong|Caused by" build-assemble.log | head -20 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - name: Assemble release APK (unsigned)
        timeout-minutes: 25
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build-assemble-release.log
      - name: Surface release assemble errors
        if: failure()
        run: |
          grep -a -E "FAILED|error:|e: .*\.kt|What went wrong|Caused by" build-assemble-release.log | head -20 | cut -c1-500 | while IFS= read -r l; do echo "::error::$l"; done; true
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoledz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoledz-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          {
            echo "# EcoleDZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil pass (design verified, icons already described)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md
      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: EcoleDZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/*.apk,app/build/outputs/apk/release/*.apk"
