name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --info 2>&1 | tee test-output.txt | tail -n 30; test ${PIPESTATUS[0]} -eq 0
      - name: Lint
        run: gradle :app:lintDebug --stacktrace || echo "lint reported issues"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee assemble-output.txt | tail -n 30; test ${PIPESTATUS[0]} -eq 0
      - name: Forward logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp test-output.txt /tmp/cilog/test-output.txt 2>/dev/null || echo "no test log" > /tmp/cilog/test-output.txt
          cp assemble-output.txt /tmp/cilog/assemble-output.txt 2>/dev/null || true
          git config user.name ci-diag
          git config user.email ci-diag@local
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/cilog/test-output.txt ./test-output.txt
          if [ -f /tmp/cilog/assemble-output.txt ]; then cp /tmp/cilog/assemble-output.txt ./assemble-output.txt; fi
          git add -A
          git commit -m "ci log $GITHUB_SHA" --allow-empty >/dev/null
          git push origin ci-logs --force
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoledz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
