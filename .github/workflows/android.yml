name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Run unit tests
        id: unittests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace --info > test-output.txt 2>&1; echo "code=$?" >> "$GITHUB_OUTPUT"; tail -n 40 test-output.txt
      - name: Publish diagnostics on test failure
        if: steps.unittests.outputs.code != '0'
        run: |
          cp test-output.txt /tmp/test-output.txt
          git config user.name ci-diag
          git config user.email ci-diag@local
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/test-output.txt ./test-output.txt
          git add test-output.txt
          git commit -m "ci diagnostics" --allow-empty
          git push origin ci-logs --force
          exit 1
      - name: Lint
        run: gradle :app:lintDebug --stacktrace || echo "lint reported issues"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoledz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
